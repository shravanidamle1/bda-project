<title>Student Performance Dashboard</title><style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--m:#4f7cff;--r:#22b573;--w:#f59e0b;--bd:#e4e7ec}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
h3{margin:0 0 12px;font-size:15px}.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.lbl{width:130px;color:var(--mut);flex:none}.bars{flex:1}.bar{height:9px;border-radius:5px;margin:2px 0}
.leg{font-size:12px;color:var(--mut);margin-bottom:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}
select{padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function grp(d,key){const o={};d.forEach(r=>(o[r[key]]=o[r[key]]||[]).push(r));return o}
function chart(title,d,key){
 const g=grp(d,key);let h='<div class="card"><h3>'+title+'</h3><div class="leg"><i style="background:var(--m)"></i>Math<i style="background:var(--r)"></i>Reading<i style="background:var(--w)"></i>Writing</div>';
 Object.keys(g).sort().forEach(k=>{h+='<div class="row"><div class="lbl">'+k+' ('+g[k].length+')</div><div class="bars">';
  ['math','reading','writing'].forEach(s=>{const v=avg(g[k].map(r=>r[s]));h+='<div style="display:flex;align-items:center;gap:6px"><div class="bar" style="width:'+v+'%;background:'+C[s]+'"></div><small>'+v.toFixed(1)+'</small></div>'});

function render(){
 const f=document.getElementById('f').value;const d=f?ALL.filter(r=>r.gender===f):ALL;
